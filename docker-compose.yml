# Sobe a aplicação completa: docker compose up --build
#   Front: http://localhost:8080   API: http://localhost:3000/api
# Os segredos abaixo são apenas para rodar localmente.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verzel_leiloes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verzel_leiloes"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./verzel-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/verzel_leiloes
      CORS_ORIGIN: http://localhost:8080
      JWT_SECRET: docker-local-jwt-secret-troque-em-producao
      ALIAS_SECRET: docker-local-alias-secret-troque-em-producao
      SIGNING_KEY_SEED: docker-local-signing-seed-troque-em-producao
      AIC_USER_AGENT: verzel-leiloes (docker local)
    ports:
      - "3000:3000"

  web:
    build:
      context: ./verzel-interface
      args:
        VITE_API_URL: http://localhost:3000/api
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
